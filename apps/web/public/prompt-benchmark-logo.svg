<svg width="280" height="56" viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Benchmark logo</title>
  <desc id="desc">A minimal prompt symbol paired with benchmark bars and the Prompt Benchmark wordmark.</desc>
  <defs>
    <linearGradient id="pbChevron" x1="14" y1="14" x2="34" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#95F4DD"/>
      <stop offset="1" stop-color="#79CFFF"/>
    </linearGradient>
    <linearGradient id="pbBars" x1="36" y1="24" x2="50" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FD2FF"/>
      <stop offset="1" stop-color="#A88CFF"/>
    </linearGradient>
    <linearGradient id="pbBorder" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78D4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9BF4DF" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="52" height="52" rx="16" fill="#0C1522"/>
  <rect x="2.5" y="2.5" width="51" height="51" rx="15.5" stroke="url(#pbBorder)"/>
  <path d="M17 15.5L28.5 28L17 40.5" stroke="url(#pbChevron)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="31" width="4.5" height="9" rx="2.25" fill="url(#pbBars)"/>
  <rect x="41.75" y="26" width="4.5" height="14" rx="2.25" fill="url(#pbBars)"/>
  <rect x="49.5" y="20" width="4.5" height="20" rx="2.25" fill="url(#pbBars)"/>

  <g fill="#EEF5FF">
    <text x="72" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="-0.04em">Prompt Benchmark</text>
  </g>
</svg>
